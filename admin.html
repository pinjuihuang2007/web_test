<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>網站管理 | 中華虛擬航空</title>
<link rel="icon" href="assets/img/favicon.png">
<style>
  :root { --bg:#f6f2fc; --card:#fff; --text:#231a2e; --muted:#6d6479; --line:#e6dded; --brand:#7b5cc4; --plum:#c73a72; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a0a2c; --card:#241238; --text:#efe9f6; --muted:#a99bbd; --line:#38244f; --brand:#b48be0; --plum:#f06b97; --ok:#5ed39a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .bar h1 { font-size:22px; margin:0; flex:1; }
  .bar small { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:17px; margin:0 0 14px; }
  .field { margin-bottom:18px; }
  .field:last-child { margin-bottom:0; }
  label { display:block; font-weight:600; margin-bottom:6px; font-size:15px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=datetime-local], textarea {
    width:100%; font:inherit; color:inherit; background:transparent;
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  textarea { min-height:100px; resize:vertical; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .hint { color:var(--muted); font-size:13px; margin-top:4px; }
  button, .link { font:inherit; cursor:pointer; border-radius:999px; padding:8px 18px; border:1px solid var(--line);
    background:transparent; color:var(--text); text-decoration:none; display:inline-block; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
  @media (prefers-color-scheme: dark) { button.primary { color:#1a0a2c; } }
  button.danger { color:var(--plum); border-color:var(--plum); }
  button.small { padding:4px 12px; font-size:13px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button[aria-selected=true] { background:var(--brand); color:#fff; border-color:var(--brand); }
  @media (prefers-color-scheme: dark) { .tabs button[aria-selected=true] { color:#1a0a2c; } }
  #msg { min-height:24px; margin:0 0 12px; font-size:14px; }
  #msg.bad { color:var(--plum); } #msg.ok { color:var(--ok); }
  .preview { display:block; width:260px; max-width:100%; aspect-ratio:16/9; object-fit:cover; margin:10px 0; border-radius:8px; border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .item { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    padding:12px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .t { flex:1; min-width:180px; }
  .item .t b { display:block; }
  .item .t span { color:var(--muted); font-size:13px; }
  .badge { font-size:12px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.on { color:var(--ok); border-color:var(--ok); }
  .check { display:flex; align-items:center; gap:8px; font-weight:600; }
  .check input { width:auto; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:560px){ .pair { grid-template-columns:1fr; } }
  .sep { border:0; border-top:1px dashed var(--line); margin:20px 0; }
  .pv { max-width:340px; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card); }
  .pv .im { aspect-ratio:16/9; background:#efe7fb; } .pv .im img { width:100%; height:100%; object-fit:cover; display:block; }
  .pv .bd { padding:14px 16px 18px; } .pv time { color:var(--plum); font-size:13px; font-weight:600; }
  .pv h3 { margin:4px 0 6px; font-size:18px; } .pv p { margin:0; color:var(--muted); white-space:pre-line; font-size:14px; }
  .pv .pin { display:inline-block; font-size:12px; color:#fff; background:var(--plum); border-radius:999px; padding:1px 9px; margin-left:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>網站管理</h1>
    <small id="who"></small>
    <button id="logout" type="button" hidden>登出</button>
  </div>
  <p id="msg" role="status"></p>

  <form id="login" class="card">
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="primary" type="submit">登入</button>
  </form>

  <section id="editor" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-ann" aria-selected="true">活動公告</button>
      <button type="button" role="tab" id="tab-site" aria-selected="false">首頁文字與圖片</button>
      <a class="link" href="index.html" target="_blank" rel="noopener" style="margin-left:auto">開啟網站預覽</a>
    </div>

    <!-- 活動公告 -->
    <div id="panel-ann">
      <div class="card">
        <h2 id="a_formtitle">新增公告</h2>
        <input type="hidden" id="a_id">
        <div class="field"><label for="a_title">標題（必填）</label><input id="a_title" type="text" maxlength="120"></div>
        <div class="pair">
          <div class="field"><label for="a_date">活動日期</label><input id="a_date" type="date">
            <div class="hint">首頁先顯示置頂的，其餘依日期由新到舊，最多 3 則。</div></div>
          <div class="field"><label for="a_time">活動開始時間（台灣時間，選填）</label><input id="a_time" type="time">
            <div class="hint">有填日期＋時間，首頁就會自動做「距離下一場還有…」倒數。</div></div>
        </div>
        <div class="field"><label for="a_body">內容</label><textarea id="a_body" maxlength="1000"></textarea>
          <div class="hint">可換行，首頁最多顯示 5 行。</div></div>
        <div class="field"><label for="a_image">圖片（選填，建議 16:9，例如 1600×900；網站卡片會以 16:9 顯示，點開可看完整原圖）</label>
          <input id="a_image" type="text" placeholder="https://… （上傳後會自動填入）">
          <img id="a_preview" class="preview" alt="" hidden>
          <input id="a_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <div class="hint">支援 PNG、JPG、WebP、GIF，5MB 以內；建議橫式 16:9。</div></div>
        <hr class="sep">
        <div class="field"><label for="a_title_en">English title（選填；英文版網頁使用，空白則顯示中文）</label><input id="a_title_en" type="text" maxlength="120"></div>
        <div class="field"><label for="a_body_en">English content（選填）</label><textarea id="a_body_en" maxlength="1000"></textarea></div>
        <hr class="sep">
        <div class="pair">
          <div class="field"><label for="a_pubat">預約發布時間（台灣時間，選填）</label><input id="a_pubat" type="datetime-local">
            <div class="hint">空白＝立刻發布。填了之後，到時間才會自動出現在網站上，不用守著按發布。需勾選下方「發佈到網站」。</div></div>
          <div class="field"><label class="check" style="margin-top:30px"><input id="a_pin" type="checkbox"> 置頂（排在最前面）</label></div>
        </div>
        <div class="field"><label class="check"><input id="a_pub" type="checkbox" checked> 發佈到網站（取消勾選＝存成草稿）</label></div>
        <div class="field" id="a_pvbox" hidden>
          <div class="row" style="margin-bottom:10px"><b>預覽</b>
            <button type="button" class="small" id="a_pv_zh">中文</button><button type="button" class="small" id="a_pv_en">English</button></div>
          <div id="a_pvcard" class="pv"></div>
        </div>
        <div class="actions">
          <button id="a_preview_btn" type="button">預覽</button>
          <button id="a_save" class="primary" type="button">儲存公告</button>
          <button id="a_cancel" type="button" hidden>取消編輯</button>
        </div>
      </div>
      <div class="card">
        <h2>所有公告</h2>
        <div id="a_list"></div>
      </div>
    </div>

    <!-- 首頁文字與圖片 -->
    <div id="panel-site" hidden>
      <div class="card"><div id="fields"></div></div>
      <div class="actions">
        <button id="save" class="primary" type="button">儲存全部變更</button>
      </div>
      <p class="hint">留空的欄位會顯示網站原本的預設內容（公告標籤留空則不顯示）。這些文字只會套用在中文版首頁。</p>
    </div>
  </section>
</main>

<script src="assets/js/site-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
(function () {
  // 「首頁文字與圖片」可編輯的欄位。要新增欄位：在這裡加一行，並在 pages/index.njk 對應元素加上 data-key（文字）或 data-img-key（圖片）。
  var FIELDS = [
    { key: "notice",         label: "首頁公告標籤",       type: "text",  hint: "顯示在首頁標題下方的小標籤，例如「本週六連飛活動」。留空則不顯示。" },
    { key: "hero_title",     label: "首頁大標題",         type: "text" },
    { key: "hero_subtitle",  label: "首頁副標題",         type: "text" },
    { key: "whyus_heading",  label: "「關於我們」標題",   type: "text" },
    { key: "whyus_welcome",  label: "「關於我們」結尾語", type: "text" },
    { key: "dispatch_image", label: "簽派系統圖片",       type: "image", hint: "支援 PNG、JPG、WebP、GIF，5MB 以內。" }
  ];
  var EXTS = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif" };

  var cfg = window.SITE_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var current = {};
  var db = null;

  function timeout(p, ms, msg) {
    return new Promise(function (ok, no) {
      var t = setTimeout(function () { no(new Error(msg)); }, ms);
      p.then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); no(e); });
    });
  }
  function say(text, bad) {
    var m = $("msg");
    m.textContent = text || "";
    m.className = text ? (bad ? "bad" : "ok") : "";
  }
  function show(loggedIn) {
    $("login").hidden = loggedIn;
    $("editor").hidden = !loggedIn;
    $("logout").hidden = !loggedIn;
    if (!loggedIn) $("who").textContent = "";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  if (!cfg || !cfg.url || !cfg.anonKey || cfg.url.indexOf("YOUR-") !== -1) {
    $("login").hidden = true;
    say("尚未設定：請先在 assets/js/site-config.js 填入 Supabase 的網址與公開金鑰。", true);
    return;
  }
  if (!window.supabase) {
    $("login").hidden = true;
    say("無法載入登入元件，請檢查網路後重新整理。", true);
    return;
  }
  db = window.supabase.createClient(cfg.url, cfg.anonKey);

  async function uploadImage(prefix, file, input, preview, fileInput) {
    var ext = EXTS[file.type];
    if (!ext) { say("只能上傳 PNG、JPG、WebP 或 GIF 圖片。", true); fileInput.value = ""; return; }
    if (file.size > 5 * 1024 * 1024) { say("圖片超過 5MB，請先壓縮再上傳。", true); fileInput.value = ""; return; }
    say("上傳中…");
    var name = prefix + "-" + Date.now() + "." + ext;
    var up = await db.storage.from("images").upload(name, file, { contentType: file.type, cacheControl: "3600" });
    if (up.error) { say("上傳失敗：" + up.error.message, true); return; }
    var url = db.storage.from("images").getPublicUrl(name).data.publicUrl;
    input.value = url;
    preview.src = url;
    preview.hidden = false;
    say("圖片已上傳，記得按「儲存」才會套用到網站。");
  }

  async function enter(session) {
    var res = await db.from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
    if (res.error || !res.data) {
      await db.auth.signOut();
      show(false);
      say("這個帳號沒有管理權限，請聯絡網站管理員把你加入管理員名單。", true);
      return;
    }
    $("who").textContent = session.user.email;
    var c = await db.from("site_content").select("key,value");
    if (c.error) { say("讀取失敗：" + c.error.message, true); return; }
    current = {};
    c.data.forEach(function (r) { current[r.key] = r.value; });
    renderFields();
    await loadAnnouncements();
    show(true);
    say("");
  }

  /* ------------------------- 分頁切換 ------------------------- */
  function selectTab(which) {
    $("tab-ann").setAttribute("aria-selected", which === "ann" ? "true" : "false");
    $("tab-site").setAttribute("aria-selected", which === "site" ? "true" : "false");
    $("panel-ann").hidden = which !== "ann";
    $("panel-site").hidden = which !== "site";
  }
  $("tab-ann").addEventListener("click", function () { selectTab("ann"); });
  $("tab-site").addEventListener("click", function () { selectTab("site"); });

  /* ------------------------- 活動公告 ------------------------- */
  var announcements = [];

  function clearForm() {
    $("a_id").value = ""; $("a_title").value = ""; $("a_date").value = "";
    $("a_body").value = ""; $("a_image").value = ""; $("a_file").value = "";
    $("a_preview").hidden = true; $("a_pub").checked = true;
    $("a_time").value = ""; $("a_title_en").value = ""; $("a_body_en").value = "";
    $("a_pubat").value = ""; $("a_pin").checked = false; $("a_pvbox").hidden = true;
    $("a_formtitle").textContent = "新增公告";
    $("a_cancel").hidden = true;
  }

  function editAnnouncement(a) {
    $("a_id").value = a.id;
    $("a_title").value = a.title || "";
    $("a_date").value = a.event_date || "";
    $("a_body").value = a.body || "";
    $("a_image").value = a.image_url || "";
    $("a_file").value = "";
    var ok = /^https:\/\//.test(a.image_url || "");
    $("a_preview").hidden = !ok;
    if (ok) $("a_preview").src = a.image_url;
    $("a_pub").checked = !!a.published;
    var ev = a.event_at ? tpe(a.event_at) : null;
    $("a_time").value = ev ? ev.time : "";
    if (ev && !a.event_date) $("a_date").value = ev.date;
    $("a_title_en").value = a.title_en || ""; $("a_body_en").value = a.body_en || "";
    var pa = a.publish_at ? tpe(a.publish_at) : null;
    $("a_pubat").value = pa ? pa.date + "T" + pa.time : "";
    $("a_pin").checked = !!a.pinned; $("a_pvbox").hidden = true;
    $("a_formtitle").textContent = "編輯公告";
    $("a_cancel").hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // 台灣時間的 日期／時間 字串（資料庫存的是 UTC）
  function tpe(iso) {
    var s = new Date(iso).toLocaleString("sv-SE", { timeZone: "Asia/Taipei", hour12: false });   // 2026-11-13 20:30:00
    return { date: s.slice(0, 10), time: s.slice(11, 16) };
  }
  function tpeToIso(date, time) {   // 把「台灣時間」轉成 ISO（UTC）
    var d = new Date(date + "T" + (time || "00:00") + ":00+08:00");
    return isNaN(d.getTime()) ? null : d.toISOString();
  }

  async function loadAnnouncements() {
    var r = await db.from("announcements").select("*")
      .order("pinned", { ascending: false })
      .order("event_date", { ascending: false, nullsFirst: false })
      .order("created_at", { ascending: false });
    if (r.error) { say("讀取公告失敗：" + r.error.message, true); return; }
    announcements = r.data;
    var box = $("a_list");
    box.textContent = "";
    if (!announcements.length) { box.appendChild(el("p", "hint", "還沒有任何公告。")); return; }
    announcements.forEach(function (a) {
      var row = el("div", "item");
      var t = el("div", "t");
      t.appendChild(el("b", "", a.title));
      t.appendChild(el("span", "", (a.event_date ? a.event_date.replace(/-/g, "/") : "未設日期") + " "));
      var scheduled = a.published && a.publish_at && new Date(a.publish_at) > new Date();
      t.appendChild(el("span", "badge" + (a.published && !scheduled ? " on" : ""), !a.published ? "草稿" : (scheduled ? "預約 " + tpe(a.publish_at).date.replace(/-/g, "/") + " " + tpe(a.publish_at).time : "已發佈")));
      if (a.pinned) t.appendChild(el("span", "badge on", " 置頂"));
      if (a.event_at) t.appendChild(el("span", "badge", " 倒數 " + tpe(a.event_at).time));
      row.appendChild(t);

      var acts = el("div", "row");
      var bEdit = el("button", "small", "編輯"); bEdit.type = "button";
      bEdit.addEventListener("click", function () { editAnnouncement(a); });
      var bPub = el("button", "small", a.published ? "改為草稿" : "發佈"); bPub.type = "button";
      bPub.addEventListener("click", async function () {
        var u = await db.from("announcements").update({ published: !a.published }).eq("id", a.id);
        if (u.error) { say("更新失敗：" + u.error.message, true); return; }
        say(a.published ? "已改為草稿，網站上不會再顯示。" : "已發佈。");
        loadAnnouncements();
      });
      var bDel = el("button", "small danger", "刪除"); bDel.type = "button";
      bDel.addEventListener("click", async function () {
        if (!window.confirm("確定要刪除「" + a.title + "」嗎？刪除後無法復原。")) return;
        var d = await db.from("announcements").delete().eq("id", a.id);
        if (d.error) { say("刪除失敗：" + d.error.message, true); return; }
        if ($("a_id").value === a.id) clearForm();
        say("已刪除。");
        loadAnnouncements();
      });
      acts.appendChild(bEdit); acts.appendChild(bPub); acts.appendChild(bDel);
      row.appendChild(acts);
      box.appendChild(row);
    });
  }

  $("a_file").addEventListener("change", function () {
    var f = $("a_file").files[0];
    if (f) uploadImage("announcement", f, $("a_image"), $("a_preview"), $("a_file"));
  });
  $("a_cancel").addEventListener("click", function () { clearForm(); say(""); });

  $("a_save").addEventListener("click", async function () {
    var title = $("a_title").value.trim();
    var img = $("a_image").value.trim();
    if (!title) { say("請填寫公告標題。", true); $("a_title").focus(); return; }
    if (img && !/^https:\/\//.test(img)) { say("圖片網址必須以 https:// 開頭。", true); return; }
    var pubat = $("a_pubat").value ? tpeToIso($("a_pubat").value.slice(0, 10), $("a_pubat").value.slice(11, 16)) : null;
    var evAt = ($("a_date").value && $("a_time").value) ? tpeToIso($("a_date").value, $("a_time").value) : null;
    if ($("a_time").value && !$("a_date").value) { say("有填活動時間，請同時選擇活動日期。", true); return; }
    var row = {
      title: title,
      body: $("a_body").value.trim(),
      event_date: $("a_date").value || null,
      event_at: evAt,
      image_url: img || null,
      published: $("a_pub").checked,
      pinned: $("a_pin").checked,
      publish_at: pubat,
      title_en: $("a_title_en").value.trim() || null,
      body_en: $("a_body_en").value.trim() || null
    };
    var id = $("a_id").value;
    var btn = $("a_save");
    btn.disabled = true;
    say("儲存中…");
    var r = id ? await db.from("announcements").update(row).eq("id", id)
               : await db.from("announcements").insert(row);
    btn.disabled = false;
    if (r.error) { say("儲存失敗：" + r.error.message, true); return; }
    say(id ? "公告已更新。" : "公告已新增。");
    clearForm();
    loadAnnouncements();
  });

  /* 發布前預覽：和網站上的卡片長得一樣（中文／英文） */
  var pvLang = "zh";
  function renderPreview() {
    var box = $("a_pvcard"); box.textContent = "";
    var en = pvLang === "en";
    var title = (en && $("a_title_en").value.trim()) || $("a_title").value.trim() || "（尚未填標題）";
    var body = (en && $("a_body_en").value.trim()) || $("a_body").value.trim();
    var img = $("a_image").value.trim();
    if (/^https:\/\//.test(img)) { var im = el("div", "im"); var i2 = document.createElement("img"); i2.src = img; i2.alt = ""; im.appendChild(i2); box.appendChild(im); }
    var bd = el("div", "bd");
    var d = $("a_date").value;
    if (d) { var line = el("time", "", d.replace(/-/g, "/") + ($("a_time").value ? " " + $("a_time").value : "")); bd.appendChild(line); }
    if ($("a_pin").checked) bd.appendChild(el("span", "pin", en ? "Pinned" : "置頂"));
    bd.appendChild(el("h3", "", title));
    if (body) bd.appendChild(el("p", "", body));
    box.appendChild(bd);
  }
  $("a_preview_btn").addEventListener("click", function () { $("a_pvbox").hidden = false; renderPreview(); $("a_pvbox").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
  $("a_pv_zh").addEventListener("click", function () { pvLang = "zh"; renderPreview(); });
  $("a_pv_en").addEventListener("click", function () { pvLang = "en"; renderPreview(); });

  /* ------------------------- 首頁文字與圖片 ------------------------- */
  function renderFields() {
    var box = $("fields");
    box.textContent = "";
    FIELDS.forEach(function (f) {
      var wrap = el("div", "field");
      var lab = el("label", "", f.label);
      lab.htmlFor = "f_" + f.key;
      wrap.appendChild(lab);

      var inp = document.createElement("input");
      inp.type = "text";
      inp.id = "f_" + f.key;
      inp.value = current[f.key] || "";
      inp.setAttribute("data-key", f.key);
      inp.setAttribute("data-type", f.type);
      if (f.type === "image") inp.placeholder = "https://… （上傳後會自動填入）";
      wrap.appendChild(inp);

      if (f.type === "image") {
        var prev = el("img", "preview");
        prev.alt = "";
        prev.hidden = !/^https:\/\//.test(inp.value);
        if (!prev.hidden) prev.src = inp.value;
        wrap.appendChild(prev);
        var file = document.createElement("input");
        file.type = "file";
        file.accept = "image/png,image/jpeg,image/webp,image/gif";
        file.addEventListener("change", function () {
          if (file.files[0]) uploadImage(f.key, file.files[0], inp, prev, file);
        });
        wrap.appendChild(file);
      }
      if (f.hint) wrap.appendChild(el("div", "hint", f.hint));
      box.appendChild(wrap);
    });
  }

  $("save").addEventListener("click", async function () {
    var rows = [];
    var bad = null;
    [].forEach.call(document.querySelectorAll("#fields [data-key]"), function (e) {
      var k = e.getAttribute("data-key");
      var v = e.value.trim();
      if (e.getAttribute("data-type") === "image" && v !== "" && !/^https:\/\//.test(v)) bad = e;
      if (v !== (current[k] || "")) rows.push({ key: k, value: v, updated_at: new Date().toISOString() });
    });
    if (bad) { say("圖片網址必須以 https:// 開頭。", true); bad.focus(); return; }
    if (!rows.length) { say("沒有變更。"); return; }
    var btn = $("save");
    btn.disabled = true;
    say("儲存中…");
    var r = await db.from("site_content").upsert(rows, { onConflict: "key" });
    btn.disabled = false;
    if (r.error) { say("儲存失敗：" + r.error.message, true); return; }
    rows.forEach(function (x) { current[x.key] = x.value; });
    say("已儲存 " + rows.length + " 個欄位。重新整理網站即可看到變更。");
  });

  /* ------------------------- 登入 / 登出 ------------------------- */
  $("login").addEventListener("submit", async function (e) {
    e.preventDefault();
    say("登入中…");
    var r;
    try {
      r = await timeout(db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value }), 15000, "登入逾時");
    } catch (err) {
      say("登入失敗：" + err.message + "。Supabase 可能被暫停了（到 Supabase 後台按 Restore project），或請關掉其他開著後台的分頁後重新整理再試。", true);
      return;
    }
    if (r.error) {
      var m = r.error.message || "";
      var hint = /invalid login/i.test(m) ? "Email 或密碼不正確（或這個帳號不存在）。"
        : /not confirmed/i.test(m) ? "這個 Email 還沒完成驗證，請到 Supabase 的 Authentication → Users 確認該帳號已驗證。"
        : /fetch|network|failed|timeout|503|502|paused/i.test(m) ? "連不上 Supabase，專案可能被暫停了，請到 Supabase 後台按「Restore project」。"
        : "";
      say("登入失敗：" + (hint || m) + (hint ? "" : "") + " [" + m + "]", true); return;
    }
    $("pw").value = "";
    try { await timeout(enter(r.data.session), 20000, "載入後台資料逾時"); }
    catch (err) { say("登入成功，但載入失敗：" + err.message, true); }
  });
  $("logout").addEventListener("click", async function () {
    await db.auth.signOut();
    show(false);
    say("已登出。");
  });

  // 重新整理後，如果還有登入狀態就直接進入
  db.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enter(r.data.session).catch(function (err) { say("載入失敗：" + err.message, true); });
  }).catch(function (err) { say("無法讀取登入狀態：" + err.message, true); });
})();
</script>
</body>
</html>
