
<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title></title>
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta name="theme-color" content="#7b5cc4">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="https://china-airlines-virtual.github.io/index-en.html">
  <meta property="og:site_name" content="">
  <meta property="og:image" content="/assets/img/ogimage.jpg">
  <meta property="og:type" content="website">

  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/favicon.png" rel="apple-touch-icon">
  <link rel="preload" as="image" href="assets/img/hero-bg.jpg">

  <!-- 只用到 Discord / Facebook 等圖示，沿用站內既有的 boxicons -->
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/css/slides.css" rel="stylesheet">
</head>

<body>

  <!-- ======= Header（白色半透明底 + 深紫字 logo） ======= -->
  <header class="top">
    <a class="brand" href="#hero"><img src="assets/img/logo-dark.png" alt=""></a>
    <nav class="top-links">
      <a href=""></a>
      <a class="pill" href="https://vamsys.io/login/china_airlines_virtual"></a>
    </nav>
  </header>

  <!-- ======= 左側頁面導覽點 ======= -->
  <nav class="dots" aria-label="Sections">
    <a href="#hero" title=""></a>
    <a href="#why-us" title=""></a>
    <a href="#announcements" title=""></a>
    <a href="#live" title=""></a>
    <a href="#dispatch" title=""></a>
    <a href="#statistics" title=""></a>
    <a href="#member" title=""></a>
    <a href="#hiring" title=""></a>
    <a href="#faq" title=""></a>
    <a href="#partners" title=""></a>
  </nav>

  <main>

  <!-- ======= 1 首頁（影片背景） ======= -->
  <section class="slide hero" id="hero">
    <div class="video" aria-hidden="true">
      <video id="hero-video" autoplay muted loop playsinline preload="metadata"
             poster="assets/img/hero-bg.jpg" data-fallback="https://www.youtube.com/embed/mOUhXYManWc?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=mOUhXYManWc&amp;controls=0&amp;showinfo=0&amp;autohide=1&amp;modestbranding=1">
        <source src="assets/video/hero.mp4" type="video/mp4">
      </video>
    </div>
    <div class="mask"></div>
    <div class="inner">
      <p class="tag fade">CHINA AIRLINES VIRTUAL</p>
      <h1 class="fade" data-key="hero_title"></h1>
      <p class="lead fade" data-key="hero_subtitle"></p>
      <p class="notice fade" data-key="notice" hidden></p>
      <div class="fade"><a class="btn" href="https://discord.gg/USDFnDamPG" target="_blank" rel="noopener"></a></div>
    </div>
    <div class="scroll-hint">SCROLL ↓</div>
  </section>

  <!-- ======= 2 關於我們 ======= -->
  <section class="slide" id="why-us">
    <div class="inner">
      <p class="tag fade">ABOUT</p>
      <h2 class="fade" data-key="whyus_heading"></h2>
      <p class="sub fade"></p>
      <div class="cols fade">
      </div>
      <p class="welcome fade" data-key="whyus_welcome"></p>
    </div>
  </section>

  <!-- ======= 3 活動公告（內容由後台管理） ======= -->
  <section class="slide tint-p" id="announcements">
    <div class="inner">
      <p class="tag fade">ANNOUNCEMENTS</p>
      <h2 class="fade"></h2>
      <div id="announcement-list" class="ann-grid"></div>
      <p id="announcement-empty" class="empty"></p>
    </div>
  </section>

  <!-- ======= 4 台灣即時航班（VATSIM 公開資料，不顯示飛行員姓名） ======= -->
  <section class="slide tint-l" id="live">
    <div class="inner">
      <p class="tag fade">LIVE</p>
      <h2 class="fade"></h2>
      <p class="sub fade"></p>
      <div class="board fade">
        <table>
          <thead>
            <tr>
              <th></th><th></th><th></th>
              <th></th><th></th>
            </tr>
          </thead>
          <tbody id="live-body" data-dep="" data-arr=""
                 data-empty="" data-error="">
            <tr><td colspan="5" class="note"></td></tr>
          </tbody>
        </table>
      </div>
      <p class="updated" id="live-updated" data-label=""></p>
    </div>
  </section>

  <!-- ======= 5 簽派系統 ======= -->
  <section class="slide" id="dispatch">
    <div class="inner split">
      <div>
        <p class="tag fade">DISPATCH</p>
        <h2 class="fade"></h2>
        <p class="sub fade"></p>
        <ul class="list fade">
        </ul>
      </div>
      <img class="fade shot" data-img-key="dispatch_image" src="assets/img/dispatch-intro.jpg" alt="" loading="lazy" decoding="async">
    </div>
  </section>

  <!-- ======= 5 統計數據（資料來自 assets/statistics.json 與 members.csv） ======= -->
  <section class="slide tint-l strong" id="statistics">
    <div class="inner">
      <p class="tag fade">STATISTICS</p>
      <h2 class="fade"></h2>
      <div class="stats fade" id="stats" data-unit-legs="" data-unit-hours="">
        <div><b id="purecounter-pilots">0</b><span></span></div>
        <div><b id="purecounter-legs">0</b><span></span></div>
        <div><b id="purecounter-time">0</b><span></span></div>
      </div>
      <div class="tabs fade" role="tablist">
        <button class="tab" type="button" role="tab" aria-selected="true" data-target="statistics-all-legs"></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="statistics-all-duration"></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="statistics-year-legs"></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="statistics-year-duration"></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="statistics-month-legs"></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-target="statistics-month-duration"></button>
      </div>
      <div class="fade">
        <ol class="rank" id="statistics-all-legs"></ol>
        <ol class="rank" id="statistics-all-duration" hidden></ol>
        <ol class="rank" id="statistics-year-legs" hidden></ol>
        <ol class="rank" id="statistics-year-duration" hidden></ol>
        <ol class="rank" id="statistics-month-legs" hidden></ol>
        <ol class="rank" id="statistics-month-duration" hidden></ol>
      </div>
    </div>
  </section>

  <!-- ======= 6 會員數位識別證（vAMSYS 授權碼 + PKCE 登入，資料只在本人瀏覽器顯示） ======= -->
  <section class="slide" id="member">
    <div class="inner narrow">
      <p class="tag fade">MEMBER ID</p>
      <h2 class="fade"></h2>
      <p class="sub fade"></p>
      <div class="fade" id="member-box"
           data-loading="" data-denied="" data-expired=""
           data-failed="" data-network=""
           data-rank="" data-hours="" data-flights=""
           data-joined="" data-other="" data-logout="">
        <div id="member-login" class="login-prompt">
          <button class="btn" type="button" id="member-login-btn"></button>
        </div>
        <p id="member-status" class="empty" role="status" hidden></p>
        <div id="member-card" class="idcard" hidden></div>
      </div>
    </div>
  </section>

  <!-- ======= 7 人才招募 ======= -->
  <section class="slide tint-p" id="hiring">
    <div class="inner">
      <p class="tag fade">JOIN US</p>
      <h2 class="fade"></h2>
      <p class="sub fade"></p>
      <div class="cols social-cards fade">
      </div>
    </div>
  </section>

  <!-- ======= 8 常見問題 ======= -->
  <section class="slide" id="faq">
    <div class="inner narrow">
      <p class="tag fade">FAQ</p>
      <h2 class="fade"></h2>
      <div class="fade">
      </div>
    </div>
  </section>

  <!-- ======= 9 合作夥伴 + 頁尾 ======= -->
  <section class="slide tint-end" id="partners">
    <div class="inner">
      <p class="tag fade">PARTNERS</p>
      <h2 class="fade"></h2>
      <div class="partners fade">
        <a class="partner" href="https://vatsim.net/" target="_blank" rel="noopener">
          <span class="logo"><img src="assets/img/logo-vatsim.png" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"></span>
        </a>
        <a class="partner" href="https://www.ivao.aero/" target="_blank" rel="noopener">
          <span class="logo"><img src="assets/img/logo-ivao.png" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"></span>
        </a>
        <a class="partner" href="https://www.hangzhouva.com/" target="_blank" rel="noopener">
          <span class="logo"><img src="assets/img/logo-hangzhou-airlines.png" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"></span>
        </a>
        <a class="partner" href="https://jalvirtual.com/" target="_blank" rel="noopener">
          <span class="logo"><img src="assets/img/logo-jal.png" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"></span>
        </a>
        <a class="partner" href="https://www.simbrief.com/home/?page=vapartners" target="_blank" rel="noopener">
          <span class="logo"><img src="assets/img/logo-simbrief.jpg" alt="" loading="lazy" decoding="async"></span>
          <span class="cap"></span>
        </a>
      </div>

      <footer class="foot fade">
        <div class="social">
          <a href="https://discord.gg/USDFnDamPG" target="_blank" rel="noopener" aria-label="Discord"><i class="bx bxl-discord"></i></a>
          <a href="https://www.facebook.com/groups/596448671760640" target="_blank" rel="noopener" aria-label="Facebook"><i class="bx bxl-facebook"></i></a>
        </div>
        <div class="links"><a href="https://vatsim.net/" target="_blank" rel="noopener">VATSIM</a><a href="https://ivao.aero/" target="_blank" rel="noopener">IVAO</a>
          <button class="linkish" type="button" id="open-privacy"></button>
          <span> <span class="mail"><img src="assets/img/email.png" alt="email"></span></span>
        </div>
        <p>&copy; Copyright <strong></strong>. All Rights Reserved</p>
        <p> </p>
      </footer>
    </div>
  </section>

  </main>

  <!-- 隱私權政策（點頁尾連結開啟） -->
  <dialog id="privacy">
    <h3></h3>
    <h4></h4>
    <p></p>
    <ul>
    </ul>
    <p><span class="mail"><img src="assets/img/email.png" alt="email"></span></p>
    <button type="button" id="close-privacy"></button>
  </dialog>


  <script defer src="assets/js/site-config.js"></script>
  <script defer src="assets/js/slides.js"></script>
  <script defer src="assets/js/content.js"></script>
  <script defer src="assets/js/member.js"></script>

</body>

</html>
